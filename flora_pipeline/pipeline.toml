# Flora pipeline settings, read by run_pipeline.py (python run_pipeline.py --help).
#
# Every key in [capture], [clean] and [pick] is handed to that step's script as
# --key-with-dashes value; true -> the flag is given, false -> it is left out; a list ->
# several values. See README.md for what each one does. Relative paths are relative to
# this file. Override any key for one run with  --set section.key=value

[paths]
captures_root = "../captures/femto_bolt/flora_unit"     # new captures are created here
points_file   = "../captures/femto_bolt/flora_unit/picked_points.txt"   # rewritten every run
name          = "plant"     # capture folder: <name>_<MM-DD>_deg_<step>_speed_<speed>

[python]
# interpreter for each step; "" = the one running run_pipeline.py
capture  = ""
register = ""
clean    = ""
pick     = ""

[capture]                   # flora_turntable_control_scripts/sweep_capture.py
port       = "COM7"         # turntable serial port (Linux: /dev/ttyACM0)
step       = 10             # degrees between shots
speed      = 5              # turntable speed 1-9
settle     = 3.0            # seconds to wait after each move before the shot
total      = 360            # degrees to sweep
warmup     = 3.0            # camera auto-exposure warm-up, seconds
home_after = true           # re-home after the sweep (plant back as in the first shot)
no_ply     = true           # skip the SDK point clouds (not used downstream)
no_preview = false          # true = no preview windows

[register]                  # femto_bolt_code/3dr_scripts/tag_register.py
max_obliquity   = 55.0      # ignore tags seen more than this many degrees from head-on
tag_size_mm     = 24.0
max_turn_error  = 2.0       # degrees: drop shots whose registered rotation is further off their logged turn; 0 = keep all
force           = false

[clean]                     # femto_bolt_code/3dr_scripts/sam3_data_cleaning.py
prompts             = ["yellow cylinder", "green plant"]
confidence          = 0.5
axis_radius         = 0.06  # metres: keep only points this close to the turntable axis
grad_max            = 20.0  # mm per px
occlusion_tol_mm    = 40.0
occlusion_window_px = 24.0
mask_erode          = 2
sor_neighbors       = 20
sor_std             = 2.0
force               = false

[pick]                      # femto_bolt_code/3dr_scripts/tag_pose_pick.py
voxel_mm        = 1.0
base_percentile = 0.5
at_deg          = ""        # e.g. "90,180": also print coordinates at these turntable angles
restitch        = false
no_view         = false
